# The room server, deployed when its own code or settings change on main
# (server/: ONLINE_OPEN, a cap, the allowed origins, a fix), the way
# Cloudflare's own deploy from GitHub did before releases took over its
# version (docs/development/online-server.md, Later). Releases deploy it
# themselves, last (.github/workflows/release.yml); this never changes the
# version it plays with: it deploys only a CURRENT_VERSION already released
# (or the one in place before the first release), shares the release's
# queue so the two never overlap, and runs the server's tests first.
# Without Cloudflare's key it does nothing. "Run workflow" deploys by hand.

name: Room server

on:
  push:
    branches: [main]
    paths: ['server/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Cloudflare's key, or nothing to do
        id: key
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::Not deployed: the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set."; fi

      # Only a released version goes live: a CURRENT_VERSION ahead of the
      # releases would lock every player out of a version not yet out.
      - name: Only the released version
        if: steps.key.outputs.deploy == 'true'
        run: |
          version="$(sed -n 's/^CURRENT_VERSION = "\(.*\)"$/\1/p' server/wrangler.toml)"
          echo "CURRENT_VERSION $version"
          if [ -n "$(git tag --list 'v*')" ] && [ -z "$(git tag --list "v$version")" ]; then
            echo "::error::CURRENT_VERSION $version is not a released version (no tag v$version): only a release puts a new version live."
            exit 1
          fi

      - name: The server's tests
        if: steps.key.outputs.deploy == 'true'
        working-directory: server
        run: npm ci && npm test

      - name: Deploy
        if: steps.key.outputs.deploy == 'true'
        working-directory: server
        run: npx wrangler deploy

      - name: The server answers
        if: steps.key.outputs.deploy == 'true'
        run: |
          url="$(node -e "import('./js/config.js').then((m) => console.log(m.CONFIG.online.serverUrl))")/health"
          for i in $(seq 1 12); do
            if curl -sSf "$url" | grep -q '"lobby":true'; then curl -sS "$url"; echo; exit 0; fi
            sleep 10
          done
          echo "::error::$url does not answer with its Lobby after two minutes."
          exit 1
