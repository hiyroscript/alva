name: Room server reachability check (temporary)
on:
  push:
    branches: [claude/amazing-mayer-0piftj]
    paths: ['.github/workflows/server-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Look up the room server's name in public DNS
        run: |
          SUB=christopherjustemsh117.workers.dev
          for NAME in "alva-rooms.$SUB" "$SUB" "anything.$SUB" workers.dev; do
            for DNS in 1.1.1.1 8.8.8.8; do
              echo "== $NAME via $DNS =="
              dig "$NAME" A @"$DNS" +noall +comments +answer +authority | grep -E 'status:|IN' || true
            done
          done
          echo "== GET /health =="
          curl -sS -m 20 -i "https://alva-rooms.$SUB/health" || echo "curl failed: $?"
