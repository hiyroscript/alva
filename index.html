<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Alva — a 2D sprite fighting game by hiyroscript. Runs in the browser on desktop, phones and tablets.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Alva">
  <meta name="format-detection" content="telephone=no">
  <title>ALVA</title>
  <link rel="icon" type="image/png" href="./alvafav.PNG">
  <style>html { background: #000; }</style>
  <!-- Stylesheet parts, in cascade order: later parts may override earlier ones. -->
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/splash.css">
  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/setup.css">
  <link rel="stylesheet" href="./css/discover.css">
  <link rel="stylesheet" href="./css/settings.css">
  <link rel="stylesheet" href="./css/battle.css">
  <link rel="stylesheet" href="./css/touch-controls.css">
  <link rel="stylesheet" href="./css/battle-overlays.css">
  <link rel="stylesheet" href="./css/practice.css">
  <link rel="stylesheet" href="./css/overlays.css">
  <link rel="stylesheet" href="./css/responsive.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <main id="app" class="app">
    <section data-i18n-aria-label="screen.splash" class="screen screen--splash" data-screen="splash" aria-label="Intro" hidden></section>
    <section class="screen screen--home" data-screen="home" hidden></section>
    <section data-i18n-aria-label="screen.mode" class="screen screen--menu screen--mode" data-screen="mode" aria-label="Select mode" hidden></section>
    <section data-i18n-aria-label="screen.difficulty" class="screen screen--menu screen--difficulty" data-screen="difficulty" aria-label="Select difficulty" hidden></section>
    <section data-i18n-aria-label="screen.character" class="screen screen--menu screen--character" data-screen="character" aria-label="Select fighter" hidden></section>
    <section data-i18n-aria-label="screen.map" class="screen screen--menu screen--map" data-screen="map" aria-label="Select map" hidden></section>
    <section data-i18n-aria-label="screen.watchDifficulty" class="screen screen--menu screen--difficulty screen--watch" data-screen="watch-difficulty" aria-label="Watch Mode: select difficulty" hidden></section>
    <section data-i18n-aria-label="screen.watchCpu1" class="screen screen--menu screen--character screen--watch" data-screen="watch-cpu1" aria-label="Watch Mode: select CPU 1" hidden></section>
    <section data-i18n-aria-label="screen.watchCpu2" class="screen screen--menu screen--character screen--watch" data-screen="watch-cpu2" aria-label="Watch Mode: select CPU 2" hidden></section>
    <section data-i18n-aria-label="screen.watchMap" class="screen screen--menu screen--map screen--watch" data-screen="watch-map" aria-label="Watch Mode: select stage" hidden></section>
    <section data-i18n-aria-label="screen.battle" class="screen screen--battle" data-screen="battle" aria-label="Battle" hidden></section>
    <section data-i18n-aria-label="screen.practice" class="screen screen--practice" data-screen="practice" aria-label="Practice Ground" hidden></section>
    <section data-i18n-aria-label="screen.discover" class="screen screen--menu screen--discover" data-screen="discover" aria-label="Discover" hidden></section>
  </main>

  <div id="loading-overlay" class="overlay loading-overlay" hidden></div>
  <div id="confirm-dialog" class="overlay dialog-overlay" hidden></div>
  <div id="settings-dialog" class="overlay settings-overlay" hidden></div>
  <div id="touch-editor" class="touch-editor" hidden></div>
  <div id="language-dialog" class="overlay language-overlay" hidden></div>

  <div id="rotate-overlay" class="rotate-overlay" role="alert">
    <div class="rotate-inner">
      <svg class="rotate-icon" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="22" y="8" width="20" height="36" rx="3.5" class="rotate-phone"/>
        <path d="M29 39h6" class="rotate-line"/>
        <path d="M14 30a18 18 0 0 1 6-12" class="rotate-arrow"/>
        <path d="M17 15.5l3.5 2.8-3.4 3" class="rotate-arrow"/>
        <rect x="14" y="44" width="36" height="14" rx="3" class="rotate-phone rotate-phone--land"/>
      </svg>
      <p class="rotate-title" data-i18n="rotate.title">Rotate your device</p>
      <p class="rotate-text" data-i18n="rotate.text">Alva is designed for landscape play.</p>
    </div>
  </div>

  <div id="boot-error" class="boot-error" hidden>
    <p lang="en">Alva could not start. Please serve it over http(s) and use a current browser.</p>
    <p lang="fr">Alva n’a pas pu démarrer. Servez-le en http(s) et utilisez un navigateur récent.</p>
  </div>
  <noscript><p class="boot-error"><span lang="en">Alva needs JavaScript enabled to run.</span> <span lang="fr">Alva a besoin de JavaScript pour fonctionner.</span></p></noscript>
</body>
</html>
