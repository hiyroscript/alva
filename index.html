<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="MAXY — a 2D sprite fighting game by hiyroscript. Runs in the browser on desktop, phones and tablets.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>MAXY</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23080808'/%3E%3Cpath fill='%23ff7a00' d='M14 12h11l7 11 7-11h11L38 32l12 20H39l-7-11-7 11H14l12-20z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <main id="app" class="app">
    <section class="screen screen--splash" data-screen="splash" aria-label="Intro" hidden></section>
    <section class="screen screen--home" data-screen="home" hidden></section>
    <section class="screen screen--menu screen--mode" data-screen="mode" aria-label="Select mode" hidden></section>
    <section class="screen screen--menu screen--character" data-screen="character" aria-label="Select fighter" hidden></section>
    <section class="screen screen--menu screen--map" data-screen="map" aria-label="Select map" hidden></section>
    <section class="screen screen--menu screen--help" data-screen="help" aria-label="Help and credits" hidden></section>
    <section class="screen screen--battle" data-screen="battle" aria-label="Battle" hidden></section>
  </main>

  <div id="loading-overlay" class="overlay loading-overlay" hidden></div>
  <div id="confirm-dialog" class="overlay dialog-overlay" hidden></div>

  <div id="rotate-overlay" class="rotate-overlay" role="alert">
    <div class="rotate-inner">
      <svg class="rotate-icon" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="22" y="8" width="20" height="36" rx="3.5" class="rotate-phone"/>
        <path d="M29 39h6" class="rotate-line"/>
        <path d="M14 30a18 18 0 0 1 6-12" class="rotate-arrow"/>
        <path d="M17 15.5l3.5 2.8-3.4 3" class="rotate-arrow"/>
        <rect x="14" y="44" width="36" height="14" rx="3" class="rotate-phone rotate-phone--land"/>
      </svg>
      <p class="rotate-title">ROTATE YOUR DEVICE</p>
      <p class="rotate-text">Maxy is designed for landscape play.</p>
    </div>
  </div>

  <div id="boot-error" class="boot-error" hidden>
    <p>MAXY could not start. Please serve it over http(s) and use a current browser.</p>
  </div>
  <noscript><p class="boot-error">MAXY needs JavaScript enabled to run.</p></noscript>
</body>
</html>
