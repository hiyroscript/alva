# Alva's room server (server/src/index.js): a Cloudflare Worker with two
# Durable Object classes. Deployed by Cloudflare from the GitHub repository
# (Workers Builds: root directory `server`, deploy command
# `npx wrangler deploy`, the Worker's name exactly `name` below), or with
# `npx wrangler deploy` from this folder; run it on your own computer with
# `npx wrangler dev` (no account needed). Step by step:
# docs/development/online-server.md.
#
# The game reaches it at https://alva-online.pages.dev, through the Pages
# project in gateway/, which calls this Worker by its name (a service
# binding), not by any address.

name = "alva-rooms"
main = "src/index.js"
compatibility_date = "2026-10-01"
# No public address of its own: the workers.dev one never came to exist in
# DNS on this account, and nothing uses it now that the gateway (gateway/)
# is the server's address. Its preview addresses are off too.
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Logs (Workers Logs, included in the free plan): the dashboard's
# alva-rooms › Logs shows refused origins and any unexpected error, the
# server's own messages, none of which names an address. Cloudflare's
# per-request records (invocation logs, which hold each caller's IP
# address) are off: no address is kept, not even in the logs.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

# The free plan only offers SQLite-backed Durable Objects, so both classes
# are created as such.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Room"]

# The relay every match goes through (server/src/privacy.js): the two
# browsers connect only through Cloudflare's TURN relay (Realtime › TURN
# Server), so neither ever learns the other's address. Each player gets a
# password of their own that lasts an hour. The relay's key is two secrets,
# never written here: TURN_KEY_ID and TURN_KEY_API_TOKEN (alva-rooms ›
# Settings › Variables and Secrets). Without them no room is made
# ("relay_unavailable"). The relay's traffic counts nothing against the
# Workers plan below; it has its own free amount (1,000 GB a month, then
# $0.05 a GB), which the safeguards further down keep the server inside.

[vars]
# Who may call the server: the itch.io pages that run the game (itch.io serves
# HTML5 games from html-classic.itch.zone and html.itch.zone, and may use
# other *.itch.zone hosts) and a copy on your own computer for testing.
# Comma-separated; * stands for any host labels before the domain, or any
# port. Change it here and deploy again (merging into main does it when
# Cloudflare deploys from GitHub); no code changes.
ALLOWED_ORIGINS = "https://html-classic.itch.zone,https://html.itch.zone,https://*.itch.zone,http://localhost:*,http://127.0.0.1:*"

# Staying inside Cloudflare's free Workers plan (checked on 2026-11-03:
# https://developers.cloudflare.com/durable-objects/platform/pricing/). Its
# daily allowance resets at 00:00 UTC:
#   - 100,000 Durable Object requests a day. HTTP requests, WebSocket
#     connections and alarms count one each; incoming WebSocket messages
#     count at 20 : 1. Past it, requests fail until the next day.
#   - 13,000 GB-s of Durable Object duration a day. Rooms hibernate their
#     sockets and the Lobby only works while answering a request, so an
#     idle server spends almost none of it.
# A room costs the server about 20 requests from creation to its last
# match (create, join, two connections, the relay's servers, the
# signalling, the reports), and a player waiting in the lobby about 12 a
# minute (the list refreshes every 5 s). The match itself costs nothing
# here: it goes through the relay.
#
# MAX_ROOMS: rooms open at once. Past it, creating a room answers `full`
# ("Servers are full right now"). 50 rooms with two players each and the
# lobby polling stay far inside the daily requests.
MAX_ROOMS = "50"
# The plan's daily request allowance, and the share of it that may be spent
# before new rooms are refused as `full`. 0.8 leaves a fifth of the day's
# requests for the rooms already open to finish their matches. The Lobby
# counts its own requests and those each Room reports.
DAILY_REQUEST_LIMIT = "100000"
BUDGET_SHARE = "0.8"
# Online play's on/off switch: "false" closes it for everyone ("Online
# play is closed right now"; a room still open closes when a player
# connects or asks for the relay); "true" opens it again. The rest of the
# game is not affected.
ONLINE_OPEN = "true"

# The relay's safeguards (Cloudflare Realtime TURN: 1,000 GB a month free,
# checked on 2026-11-03; past it, $0.05 a GB). The Lobby counts them
# (server/src/lobby.js):
#
# MAX_MATCHES: rooms with both players at once (the players of those rooms
# are connected through the relay; a host waiting alone, or anyone in the
# lobby, does not count). Past it, joining a room answers `full` ("Servers
# are full right now") until a room ends or a player leaves.
MAX_MATCHES = "10"
# The monthly safety stop, the real guarantee: the Lobby estimates the
# month's relay use (UTC) from the time rooms spend with both players
# (menus included, not only matches), at RELAY_GB_PER_HOUR each, and once it
# reaches RELAY_MONTHLY_GB, Online play closes until the next month
# ("Online play has reached its limit for this month"). A match uses about
# 0.1 to 0.2 GB of relay an hour (an estimate from the game's packets, 60 a
# second each way: 0.2 if Cloudflare counts a packet at both players'
# relays), so the estimate takes the high end. 450 is under half the free
# 1,000 GB, so even a billing month that does not start on the 1st (it
# straddles two calendar months) stays inside it. That is still about 2,250
# hours of both players in a room a month (27,000 five-minute matches).
# Cloudflare's own figure is in its dashboard (Realtime, and the account's
# billing): after some play, compare, and the rate can be adjusted.
RELAY_GB_PER_HOUR = "0.2"
RELAY_MONTHLY_GB = "450"
# Relay passwords handed out an hour, server-wide (each player gets one a
# link; each lasts an hour, and the game renews its link between matches
# before it runs out). 10 matches use about 20 to 40 an hour.
RELAY_PASSWORDS_PER_HOUR = "120"

# A room with no activity this long closes itself.
ROOM_IDLE_MINUTES = "10"
# Per address, a minute: rooms created, joins tried, list reads (the game
# reads the list 12 times a minute; several players can share an address).
CREATE_PER_MINUTE = "10"
JOIN_PER_MINUTE = "30"
LIST_PER_MINUTE = "120"
